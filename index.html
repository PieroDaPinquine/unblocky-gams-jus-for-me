<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/scoutdingo@main/">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Pizza Tower: Scoutdigo (Smooth Fix)</title>
    <style>
        body {
            margin: 0; background: black; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; touch-action: none;
        }

        /* The Game Screen */
        canvas.emscripten {
            display: none;
            image-rendering: pixelated;
            -webkit-optimize-contrast;
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            outline: none;
            /* GPU Acceleration */
            transform: translateZ(0);
        }

        /* Loading UI */
        #loading-overlay {
            text-align: center; color: white; font-family: sans-serif;
        }

        .spinner-fancy {
            width: 50px; height: 50px; margin: 20px auto;
            border: 5px solid #333; border-top: 5px solid #bdff00;
            border-radius: 50%; animation: spin 1s linear infinite;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Performance Footer */
        .controls {
            position: absolute; bottom: 10px; opacity: 0.3; transition: 0.3s;
        }
        .controls:hover { opacity: 1; }
        .btn {
            background: #222; color: #bdff00; border: 1px solid #bdff00;
            padding: 5px 15px; cursor: pointer; border-radius: 4px;
        }

        /* Hiding the elements index.js looks for without deleting them */
        #status, #progress, #spinner { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner-fancy"></div>
        <div id="custom-status" style="font-size: 18px; letter-spacing: 2px;">PREPARING PIZZA...</div>
    </div>

    <div id="status"></div>
    <progress id="progress" value="0" max="100"></progress>
    <div id="spinner"></div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div class="controls">
        <button class="btn" onclick="toggleFullscreen()">FULLSCREEN</button>
    </div>

    <script>
        // Global functions for the engine
        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        const customStatus = document.getElementById('custom-status');
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('loading-overlay');
        
        let totalBytes = 315181892;
        let loadedBytes = 0;

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                loadedBytes += value.length;

                let percent = ((loadedBytes / totalBytes) * 100).toFixed(0);
                customStatus.textContent = `LOADING: ${percent}%`;
            }
            return new Blob(chunks);
        }

        (async () => {
            try {
                // Fetch and merge parts
                const parts = Array.from({length: 16}, (_, i) => `game.unx.part${i + 1}`);
                const blobs = await Promise.all(parts.map(fetchWithProgress));
                window.gameUnxUrl = URL.createObjectURL(new Blob(blobs));

                // Intercept game fetch
                const originalFetch = window.fetch;
                window.fetch = (url, options) => {
                    if (typeof url === 'string' && url.includes("game.unx")) return originalFetch(window.gameUnxUrl);
                    return originalFetch(url, options);
                };

                // Remove loader UI once logic is ready
                overlay.style.display = "none";
                canvas.style.display = "block";

                // Load GameMaker Scripts
                const s1 = document.createElement('script'); s1.src = "index.js";
                const s2 = document.createElement('script'); s2.src = "runner.js";
                document.body.appendChild(s1);
                document.body.appendChild(s2);

            } catch (e) {
                customStatus.textContent = "ERROR: CHECK INTERNET/BROWSER";
            }
        })();
    </script>
</body>
</html>
